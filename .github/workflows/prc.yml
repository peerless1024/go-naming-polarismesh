name: Pull Request Check
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO111MODULE: on
  GOTOOLCHAIN: local

jobs:
  build:
    name: go-${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.19", "1.20", "1.21", "1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v -count=1 -timeout=10m -coverprofile=coverage.out ./...
      - name: Upload coverage reports to Codecov
        if: matrix.go == '1.24'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Validate shell scripts
        run: find examples -name '*.sh' -print0 | xargs -0 -n1 bash -n

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run race detector
        run: >-
          go test -race -count=1 -timeout=10m
          ./circuitbreaker
          ./internal/polaris
          ./selector
          ./loadbalance
          ./registry

  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=30m --new-from-rev=origin/main
          skip-cache: true

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: typos
        uses: crate-ci/typos@v1.52.0

  go-apidiff:
    if: github.event_name == 'pull_request'
    name: api compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: joelanford/go-apidiff@v0.8.3
